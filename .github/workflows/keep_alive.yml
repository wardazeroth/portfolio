name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
          - name: Query Supabase Database
            run: |
              RAW_URL="${{ secrets.SUPABASE_URL }}"
              BASE_URL="${RAW_URL%/}"

              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 \
                -X GET "$BASE_URL/rest/v1/portfolio_proyecto?select=*&limit=1" \
                -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

              echo "Respuesta HTTP: $HTTP_STATUS"

              if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 206 ]; then
                echo "Error: La consulta no generó actividad válida en la base de datos."
                exit 1
              fi